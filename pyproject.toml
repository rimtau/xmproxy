[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xmproxy"
version = "0.1.0"
description = "HTTP, HTTPS and WebSocket inspection proxy with upstream support"
requires-python = ">=3.12"
dependencies = ["mitmproxy==12.2.1"]

[project.scripts]
xmproxy = "xmproxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["aiohttp==3.13.3"]
